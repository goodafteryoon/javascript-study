# 일급 함수
- 함수가 값으로 다뤄질 수 있다

# 고차 함수
- 함수를 값으로 다루는 함수

## 함수를 인자로 받아서 실행하는 함수
- apply1
- times

<script>
  const apply1 = f => f(1) // 함수가 함수를 받아서 안에서 실행하고 있기 때문에 함수를 인자값으로 다루고 있기 때문에 고차함수
  const add2 = a => a + 2;
  log(apply1(add2)); // 3
  log(apply1(a => a - 1)); // 0

  const times = (f, n) => {
    let i = -1;
    while (++i < n) f(i); // ++i 먼저 증가하고 사용, i++ 먼저 사용하고 증가
  }

  times(log, 3); // 0 1 2
  times(a => log(a + 10), 3); // 10 11 12
</script>

## 함수를 만들어 리턴하는 함수 (클로저를 만들어 리턴하는 함수)
- addMaker
- 클로저는 b => a + b 이 함수가 a를 기억하고 있는 것
- b => a + b 이 함수는 함수이자 a를 기억하고 있는 클로저
- 클로저는 b => a + b 이 함수가 만들어질 때의 환경인 a와 b => a + b 이 함수 자체의 객체를 함께 통칭해서 말하는 것

<script>
  const addMaker = a => b => a + b;
  const add10 = addMaker(10);
  log(add10); // b => a + b;
  log(add10(5)); // 15 -> 첫번째 매개변수에 10이 들어가고 10을 기억하고 있다가 두번째 매개변수에 5가 들어가서 15가 되는 것
  log(add10(10)); // 20
</script>
